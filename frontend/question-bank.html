<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的题目库</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar"></div>
<div class="container">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h2 style="margin:0;">我的题目库</h2>
      <p class="muted" style="margin:6px 0 0;">保存的题目可在创建问卷时直接复用。</p>
    </div>
    <a class="btn btn-primary" href="/create.html">去创建问卷</a>
  </div>
  <div id="list"><p class="muted">加载中…</p></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const TYPE_LABEL = { single: "单选", multiple: "多选", text: "文本填空", number: "数字填空" };

function questionSummary(q) {
  const parts = [`<span class="badge">${TYPE_LABEL[q.type] || q.type}</span>`];
  if (q.required) parts.push(`<span class="badge gray">必填</span>`);
  if (q.type === "single" || q.type === "multiple") {
    parts.push(`<span class="badge gray">${q.options.length} 个选项</span>`);
    if (q.type === "multiple") {
      const lo = q.min_choices || 0;
      const hi = q.max_choices ?? "不限";
      parts.push(`<span class="badge gray">选 ${lo}~${hi} 项</span>`);
    }
  } else if (q.type === "text") {
    const hi = q.max_length ?? "不限";
    parts.push(`<span class="badge gray">${q.min_length || 0}~${hi} 字</span>`);
  } else if (q.type === "number") {
    const lo = q.min_value ?? "不限";
    const hi = q.max_value ?? "不限";
    parts.push(`<span class="badge gray">范围 ${lo}~${hi}</span>`);
    if (q.integer_only) parts.push(`<span class="badge gray">仅整数</span>`);
  }
  return parts.join("");
}

async function loadList() {
  const el = document.getElementById("list");
  try {
    const list = await api.listBank();
    if (!list.length) {
      el.innerHTML = `<p class="muted">题目库还是空的。在创建问卷时点击题目的“存入题目库”即可保存。</p>`;
      return;
    }
    el.innerHTML = list.map((item) => {
        const q = item.question;
        const sharedBadge = item.shared_from
            ? `<span class="badge gray">来自 ${escapeHtml(item.shared_from_username || "其他用户")}</span>`
            : "";
        return `
            <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
                <div style="flex:1;">
                <h3 style="margin:0 0 6px;">${escapeHtml(item.name || q.title)}</h3>
                <div>
                    ${sharedBadge}
                    ${questionSummary(q)}
                </div>
                ${q.type === "single" || q.type === "multiple" ? `
                    <ul style="margin:10px 0 0;color:#555;font-size:14px;">
                    ${q.options.map((o) => `<li>${escapeHtml(o.label)}</li>`).join("")}
                    </ul>` : ""}
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-sm" onclick="editItem('${item.id}')">编辑</button>
                    <button class="btn btn-sm" onclick="copyItem('${item.id}')">复制</button>
                    <button class="btn btn-sm" onclick="openHistory('${item.id}')">历史</button>
                    ${item.shared_from ? "" : `<button class="btn btn-sm" onclick="shareItem('${item.id}')">分享</button>`}
                    <button class="btn btn-danger btn-sm" onclick="removeItem('${item.id}', this)">删除</button>
                    <button class="btn btn-sm" onclick="openUsages('${item.id}')">使用情况</button>
                </div>
            </div>
            </div>`;
    }).join("");
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(e.detail || "加载失败")}</p>`;
  }
}

async function removeItem(id, btn) {
  if (!confirm("确定从题目库删除该题目吗？")) return;
  btn.disabled = true;
  try {
    await api.deleteBank(id);
    loadList();
  } catch (e) {
    alert(e.detail || "删除失败");
    btn.disabled = false;
  }
}

async function shareItem(id) {
  const username = prompt("输入要分享给的用户名：");
  if (!username || !username.trim()) return;
  try {
    await api.shareBank(id, username.trim());
    alert(`已分享给 ${username.trim()}`);
  } catch (e) {
    alert(e.detail || "分享失败");
  }
}

let editTarget = null;   // { id, item }
let editDraft = null;

async function editItem(id) {
  try {
    const list = await api.listBank();
    editTarget = list.find((x) => x.id === id);
    if (!editTarget) { alert("题目不存在"); return; }
    editDraft = JSON.parse(JSON.stringify(editTarget.question));
    editDraft.name = editTarget.name || editDraft.title || "";
    editDraft.required = !!editDraft.required;
    editDraft.options = editDraft.options || [];
    editDraft.min_choices = editDraft.min_choices ?? 0;
    editDraft.max_choices = editDraft.max_choices ?? null;
    editDraft.min_length = editDraft.min_length ?? 0;
    editDraft.max_length = editDraft.max_length ?? null;
    editDraft.min_value = editDraft.min_value ?? null;
    editDraft.max_value = editDraft.max_value ?? null;
    editDraft.integer_only = !!editDraft.integer_only;
    renderEditForm();
    document.getElementById("editModal").classList.remove("hidden");
  } catch (e) {
    alert(e.detail || "加载失败");
  }
}

function renderEditForm() {
  const q = editDraft;
  const typeOptions = [
    ["single", "单选"], ["multiple", "多选"], ["text", "文本填空"], ["number", "数字填空"],
  ].map(([v, l]) => `<option value="${v}" ${q.type === v ? "selected" : ""}>${l}</option>`).join("");

  let body = `
    <div class="form-group"><label>题目名称（库中显示）</label>
      <input id="e_name" value="${escapeHtml(q.name || "")}" />
    </div>
    <div class="form-group"><label>题目标题</label>
      <input id="e_title" value="${escapeHtml(q.title || "")}" />
    </div>
    <div class="form-row">
      <div class="form-group"><label>题型</label>
        <select id="e_type" onchange="onEditTypeChange(this.value)">${typeOptions}</select>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end;">
        <label class="checkbox-line"><input type="checkbox" id="e_required" ${q.required ? "checked" : ""} /> 必填</label>
      </div>
    </div>`;

  if (q.type === "single" || q.type === "multiple") {
    body += `<div class="form-group"><label>选项（文字 + 值）</label><div id="e_options">`;
    q.options.forEach((o, i) => {
      body += `<div class="option-row">
        <input id="e_opt_label_${i}" value="${escapeHtml(o.label || "")}" placeholder="选项文字" />
        <input id="e_opt_value_${i}" value="${escapeHtml(o.value || "")}" placeholder="值" />
        <button class="btn btn-sm btn-danger" onclick="removeEditOption(${i})">删</button>
      </div>`;
    });
    body += `</div><button class="btn btn-sm" onclick="addEditOption()">+ 选项</button></div>`;
    if (q.type === "multiple") {
      body += `<div class="form-row">
        <div class="form-group"><label>最少选择</label><input id="e_min_choices" type="number" min="0" value="${q.min_choices}" /></div>
        <div class="form-group"><label>最多选择（空=不限）</label><input id="e_max_choices" type="number" min="1" value="${q.max_choices ?? ""}" /></div>
      </div>`;
    }
  } else if (q.type === "text") {
    body += `<div class="form-row">
      <div class="form-group"><label>最少字数</label><input id="e_min_length" type="number" min="0" value="${q.min_length}" /></div>
      <div class="form-group"><label>最多字数（空=不限）</label><input id="e_max_length" type="number" min="1" value="${q.max_length ?? ""}" /></div>
    </div>`;
  } else if (q.type === "number") {
    body += `<div class="form-row">
      <div class="form-group"><label>最小值（空=不限）</label><input id="e_min_value" type="number" value="${q.min_value ?? ""}" /></div>
      <div class="form-group"><label>最大值（空=不限）</label><input id="e_max_value" type="number" value="${q.max_value ?? ""}" /></div>
    </div>
    <label class="checkbox-line"><input type="checkbox" id="e_integer_only" ${q.integer_only ? "checked" : ""} /> 仅整数</label>`;
  }

  document.getElementById("editForm").innerHTML = body;
  document.getElementById("editError").textContent = "";
}

function onEditTypeChange(t) {
  // 读取当前已填内容到 draft
  collectEditDraft();
  editDraft.type = t;
  if ((t === "single" || t === "multiple") && (!editDraft.options || !editDraft.options.length)) {
    editDraft.options = [{ label: "", value: "" }, { label: "", value: "" }];
  }
  renderEditForm();
}

function addEditOption() {
  collectEditDraft();
  editDraft.options.push({ label: "", value: "" });
  renderEditForm();
}
function removeEditOption(i) {
  collectEditDraft();
  editDraft.options.splice(i, 1);
  renderEditForm();
}

function collectEditDraft() {
  const q = editDraft;
  q.name = (document.getElementById("e_name")?.value || "").trim();
  q.title = (document.getElementById("e_title")?.value || "").trim();
  q.required = document.getElementById("e_required")?.checked || false;
  if (q.type === "single" || q.type === "multiple") {
    q.options = (q.options || []).map((o, i) => ({
      label: (document.getElementById(`e_opt_label_${i}`)?.value || "").trim(),
      value: (document.getElementById(`e_opt_value_${i}`)?.value || "").trim(),
    }));
    if (q.type === "multiple") {
      const mc = document.getElementById("e_min_choices")?.value;
      const xc = document.getElementById("e_max_choices")?.value;
      q.min_choices = mc === "" ? 0 : Number(mc);
      q.max_choices = xc === "" ? null : Number(xc);
    }
  } else if (q.type === "text") {
    const ml = document.getElementById("e_min_length")?.value;
    const xl = document.getElementById("e_max_length")?.value;
    q.min_length = ml === "" ? 0 : Number(ml);
    q.max_length = xl === "" ? null : Number(xl);
  } else if (q.type === "number") {
    const mv = document.getElementById("e_min_value")?.value;
    const xv = document.getElementById("e_max_value")?.value;
    q.min_value = mv === "" ? null : Number(mv);
    q.max_value = xv === "" ? null : Number(xv);
    q.integer_only = document.getElementById("e_integer_only")?.checked || false;
  }
}

function closeEdit() {
  document.getElementById("editModal").classList.add("hidden");
}

async function submitEdit() {
  const errEl = document.getElementById("editError");
  errEl.textContent = "";
  try {
    collectEditDraft();
    const q = editDraft;
    if (!q.title) throw "题目标题不能为空";
    const payload = {
      id: q.id || "q1",
      type: q.type,
      title: q.title,
      required: !!q.required,
      jump_rules: q.jump_rules || [],
    };
    if (q.type === "single" || q.type === "multiple") {
      const options = (q.options || []).filter((o) => o.label && o.value);
      if (!options.length) throw "至少一个有效选项（文字和值都必填）";
      payload.options = options;
      if (q.type === "multiple") {
        payload.min_choices = q.min_choices || 0;
        payload.max_choices = q.max_choices ?? null;
      }
    } else if (q.type === "text") {
      payload.min_length = q.min_length || 0;
      payload.max_length = q.max_length ?? null;
    } else if (q.type === "number") {
      payload.min_value = q.min_value ?? null;
      payload.max_value = q.max_value ?? null;
      payload.integer_only = !!q.integer_only;
    }
    await api.updateBank(editTarget.id, payload, q.name || q.title);
    closeEdit();
    alert("已保存，旧版本已记入历史");
    loadList();
  } catch (e) {
    errEl.textContent = e.detail || e;
  }
}

// 历史
let historyTargetId = null;
async function openHistory(id) {
  historyTargetId = id;
  document.getElementById("historyDetail").innerHTML = "";
  document.getElementById("historyModal").classList.remove("hidden");
  const el = document.getElementById("historyList");
  el.innerHTML = `<p class="muted">加载中…</p>`;
  try {
    const items = await api.bankHistory(id);
    if (!items.length) { el.innerHTML = `<p class="muted">暂无历史</p>`; return; }
    el.innerHTML = items.map((it) => `
      <div class="card" style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
          <div>
            <strong>v${it.version}</strong>
            <span class="badge gray" style="margin-left:8px;">${it.action}</span>
            <div class="muted" style="margin-top:4px;">
              ${escapeHtml(it.name || it.title)} · ${new Date(it.created_at).toLocaleString()}
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-sm" onclick="viewHistoryVersion(${it.version})">查看</button>
            <button class="btn btn-sm btn-primary" onclick="restoreHistory(${it.version})">恢复此版本</button>
          </div>
        </div>
      </div>`).join("");
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(e.detail || "加载失败")}</p>`;
  }
}

function closeHistory() {
  document.getElementById("historyModal").classList.add("hidden");
}

async function viewHistoryVersion(version) {
  const el = document.getElementById("historyDetail");
  el.innerHTML = `<p class="muted">加载中…</p>`;
  try {
    const d = await api.bankHistoryVersion(historyTargetId, version);
    const q = d.question;
    el.innerHTML = `
      <div class="card">
        <h3>v${d.version}（${d.action}）</h3>
        <p class="muted">${escapeHtml(d.name || q.title)} · ${new Date(d.created_at).toLocaleString()}</p>
        <pre style="white-space:pre-wrap;background:#f7f8fa;padding:10px;border-radius:8px;font-size:12px;">${escapeHtml(JSON.stringify(q, null, 2))}</pre>
      </div>`;
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(e.detail || "加载失败")}</p>`;
  }
}

async function restoreHistory(version) {
  if (!confirm(`确定恢复到 v${version} 吗？当前版本会记入历史，可再次恢复。`)) return;
  try {
    await api.restoreBank(historyTargetId, version);
    alert("已恢复");
    closeHistory();
    loadList();
  } catch (e) {
    alert(e.detail || "恢复失败");
  }
}

async function copyItem(id) {
  const name = prompt("新题目名称（可留空，默认追加“（副本）”）", "");
  if (name === null) return; // 取消
  try {
    await api.copyBank(id, name.trim() || null);
    alert("已复制为新题目");
    loadList();
  } catch (e) {
    alert(e.detail || "复制失败");
  }
}

async function openUsages(id) {
  document.getElementById("usagesModal").classList.remove("hidden");
  const el = document.getElementById("usagesList");
  el.innerHTML = `<p class="muted">加载中…</p>`;
  try {
    const list = await api.bankUsages(id);
    if (!list.length) {
      el.innerHTML = `<p class="muted">该题目尚未被任何问卷使用。</p>`;
      return;
    }
    // 按问卷聚合（同一问卷多次插入合并展示）
    const bySurvey = {};
    for (const it of list) {
      if (!bySurvey[it.survey_id]) {
        bySurvey[it.survey_id] = {
          survey_id: it.survey_id,
          survey_title: it.survey_title,
          created_at: it.created_at,
          response_count: it.response_count,
          question_ids: [],
        };
      }
      bySurvey[it.survey_id].question_ids.push(it.question_id);
    }
    el.innerHTML = Object.values(bySurvey).map((s) => `
      <div class="card" style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
          <div>
            <strong>${escapeHtml(s.survey_title)}</strong>
            <div class="muted" style="margin-top:4px;">
              ${s.created_at ? new Date(s.created_at).toLocaleString() : ""}
              · 回答 ${s.response_count}
              · 题号 ${s.question_ids.join(", ")}
            </div>
          </div>
          <a class="btn btn-sm" href="/survey-detail/${s.survey_id}">查看问卷</a>
        </div>
      </div>`).join("");
  } catch (e) {
    el.innerHTML = `<p class="error">${escapeHtml(e.detail || "加载失败")}</p>`;
  }
}

function closeUsages() {
  document.getElementById("usagesModal").classList.add("hidden");
}

if (requireLogin()) {
  renderNavbar("bank");
  loadList();
}
</script>
<!-- 编辑弹窗 -->
<div id="editModal" class="modal-mask hidden">
    <div class="modal" style="max-width:560px;">
      <h3>编辑题目</h3>
      <div id="editForm"></div>
      <p class="error" id="editError"></p>
      <div class="modal-actions">
        <button class="btn" onclick="closeEdit()">取消</button>
        <button class="btn btn-primary" onclick="submitEdit()">保存</button>
      </div>
    </div>
  </div>
  
  <!-- 历史弹窗 -->
  <div id="historyModal" class="modal-mask hidden">
    <div class="modal" style="max-width:640px;">
      <h3>历史版本</h3>
      <div id="historyList"><p class="muted">加载中…</p></div>
      <div id="historyDetail" style="margin-top:12px;"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeHistory()">关闭</button>
      </div>
    </div>
  </div>
  <div id="usagesModal" class="modal-mask hidden">
    <div class="modal" style="max-width:640px;">
      <h3>使用情况</h3>
      <div id="usagesList"><p class="muted">加载中…</p></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeUsages()">关闭</button>
      </div>
    </div>
  </div>
</body>
</html>
